version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bdride-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: bd_ride_share
      MYSQL_USER: bdride
      MYSQL_PASSWORD: bdride
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: bdride-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: bdride-api
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: bd_ride_share
      DB_USERNAME: bdride
      DB_PASSWORD: bdride
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_DRIVER: pusher
    depends_on:
      - mysql
      - redis
    volumes:
      - ../../apps/api:/var/www/html

volumes:
  mysql_data:
  redis_data:
