# One-time (or manual retry): lock main so only owner can push/merge.
# Auto-runs when this file is pushed; or: Actions → Enable Main Branch Protection → Run workflow
name: Enable Main Branch Protection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-branch-protection.yml
      - scripts/branch-protection-main.json

permissions:
  administration: write
  contents: read

jobs:
  protect-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply branch protection to main
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const cfg = JSON.parse(
              fs.readFileSync('scripts/branch-protection-main.json', 'utf8'),
            )
            try {
              await github.rest.repos.updateBranchProtection({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
                ...cfg,
              })
              core.info('Branch protection enabled on main.')
            } catch (error) {
              core.error(error.message)
              core.error(
                'If 403: GitHub → Settings → Actions → General → Workflow permissions → Read and write, then re-run this workflow.',
              )
              throw error
            }
