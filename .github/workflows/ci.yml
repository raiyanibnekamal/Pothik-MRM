name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]

jobs:
  api:
    name: Laravel API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, redis
          coverage: none
      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret -f
          touch database/database.sqlite
          php artisan migrate --force
      - name: Run tests
        run: php artisan test

  admin:
    name: Admin panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install & build
        run: |
          pnpm install --filter admin-panel...
          pnpm --filter admin-panel build

  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze mobile_core
        run: |
          cd packages/mobile_core && flutter pub get && flutter analyze --no-fatal-infos
      - name: Analyze passenger app
        run: |
          cd apps/passenger-app && flutter pub get && flutter analyze --no-fatal-infos

  e2e:
    name: Admin E2E smoke
    runs-on: ubuntu-latest
    needs: [admin]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install Playwright
        run: |
          pnpm install --filter @bd-ride-share/e2e...
          pnpm --filter @bd-ride-share/e2e exec playwright install chromium --with-deps
      - name: Run smoke (mock mode)
        run: pnpm --filter @bd-ride-share/e2e test
        env:
          CI: true
