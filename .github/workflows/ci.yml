name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]

jobs:
  api:
    name: Laravel API
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, redis, curl
          coverage: none
      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret -f
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/CACHE_DRIVER=redis/CACHE_DRIVER=array/' .env
          sed -i 's/QUEUE_CONNECTION=redis/QUEUE_CONNECTION=sync/' .env
          # Reverb is not installed on Laravel 9 — never boot artisan with it.
          sed -i 's/BROADCAST_DRIVER=reverb/BROADCAST_DRIVER=log/' .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env
          echo "REDIS_PORT=6379" >> .env
          touch database/database.sqlite
          php artisan migrate --force
      - name: Run tests
        run: php artisan test

  admin:
    name: Admin panel (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Vitest unit tests
        working-directory: apps/admin-panel
        run: pnpm test
      - name: Build (lint + tsc + vite)
        working-directory: apps/admin-panel
        run: pnpm build

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze mobile_core
        run: |
          cd packages/mobile_core && flutter pub get && flutter analyze --no-fatal-infos
      - name: Test mobile_core
        run: |
          cd packages/mobile_core && flutter test
      - name: Analyze passenger app
        run: |
          cd apps/passenger-app && flutter pub get && flutter analyze --no-fatal-infos
      - name: Test passenger app
        run: |
          cd apps/passenger-app && flutter pub get && flutter test
      - name: Analyze driver app
        run: |
          cd apps/driver-app && flutter pub get && flutter analyze --no-fatal-infos
      - name: Test driver app
        run: |
          cd apps/driver-app && flutter pub get && flutter test

  e2e:
    name: Admin E2E smoke
    runs-on: ubuntu-latest
    needs: [admin]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Playwright
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @bd-ride-share/e2e exec playwright install chromium --with-deps
      - name: Run smoke (mock mode)
        run: pnpm --filter @bd-ride-share/e2e test
        env:
          CI: true
