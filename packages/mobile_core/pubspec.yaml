name: mobile_core
description: Shared Flutter core for BD Ride Share passenger and driver apps.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^16.2.4
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.2
  connectivity_plus: ^6.1.5
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  share_plus: ^11.1.0
  sensors_plus: ^6.1.2
  intl: ^0.20.2
  equatable: ^2.0.7
  phosphor_icons: ^3.0.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  socket_io_client: ^3.1.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  web_socket_channel: ^3.0.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  stream_channel: ^2.1.4

flutter:
  assets:
    - l10n/
